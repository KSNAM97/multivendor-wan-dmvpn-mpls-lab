! cisco
!
hostname hq-sw-2
enable secret admin1234
no ip domain-lookup
service timestamps debug datetime msec
service timestamps log datetime msec
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 password admin1234
 login
!
int lo0
 ip addr 11.11.11.12 255.255.255.255
!
int gi1/0
 desc to hq-r1 gi0/0
 no switchport
 ip addr 10.1.0.2 255.255.255.252
 no sh
!
int gi1/1
 desc to hq-r2 gi0/0
 no switchport
 ip addr 10.1.0.6 255.255.255.252
 no sh
!
