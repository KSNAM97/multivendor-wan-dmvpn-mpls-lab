! cisco
!
hostname hq-sw-3
enable secret admin1234
no ip domain-lookup
service timestamps debug datetime msec
service timestamps log datetime msec
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 password admin1234
 login
!
int lo0
 ip addr 11.11.11.13 255.255.255.255
!
int gi1/0
 desc to hq-r1 gi1/0
 no switchport
 ip addr 10.1.0.10 255.255.255.252
 no sh
!
int gi1/1
 desc to hq-r2 gi1/0
 no switchport
 ip addr 10.1.0.14 255.255.255.252
 no sh
!
