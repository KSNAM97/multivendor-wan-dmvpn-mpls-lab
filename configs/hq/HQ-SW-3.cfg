! HQ-SW-3 - 기본 컨피그 틀
! 기준 문서: docs/port-mapping.md (포트), docs/ip-mapping.md (IP)
! 포함: 호스트네임, 콘솔 설정, 인터페이스 설명, L3 링크 IP
! 제외: OSPF, BGP, HSRP/VARP, VLAN, EtherChannel, ACL, QoS, DMVPN (일정표의 주차별 작업에서 추가)
! 루프백, 라우터 ID: 미정
!
hostname HQ-SW-3
no ip domain-lookup
service timestamps debug datetime msec
service timestamps log datetime msec
!
ip routing
!
interface GigabitEthernet0/0
 description to HQ-SW-1 Gi1/2 (Po2)
 ! L2 링크: 스위치포트 설정은 해당 주차 작업에서 추가
 no shutdown
!
interface GigabitEthernet0/1
 description to HQ-SW-1 Gi1/3 (Po2)
 ! L2 링크: 스위치포트 설정은 해당 주차 작업에서 추가
 no shutdown
!
interface GigabitEthernet0/2
 description to HQ-SW-2 Gi0/2 (Po3)
 ! L2 링크: 스위치포트 설정은 해당 주차 작업에서 추가
 no shutdown
!
interface GigabitEthernet0/3
 description to HQ-SW-2 Gi0/3 (Po3)
 ! L2 링크: 스위치포트 설정은 해당 주차 작업에서 추가
 no shutdown
!
interface GigabitEthernet1/0
 description to HQ-R1 Gi1/0
 no switchport
 ip address 10.1.0.10 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/1
 description to HQ-R2 Gi1/0
 no switchport
 ip address 10.1.0.14 255.255.255.252
 no shutdown
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
end
