! HQ-SW-1 - 기본 컨피그 틀
! 기준 문서: docs/port-mapping.md (포트), docs/ip-mapping.md (IP)
! 포함: 호스트네임, 콘솔 설정, 인터페이스 설명, L3 링크 IP
! 제외: OSPF, BGP, HSRP/VARP, VLAN, EtherChannel, ACL, QoS, DMVPN (일정표의 주차별 작업에서 추가)
! 루프백, 라우터 ID: 미정
!
hostname HQ-SW-1
no ip domain-lookup
service timestamps debug datetime msec
service timestamps log datetime msec
!
ip routing
!
interface GigabitEthernet1/0
 description to HQ-SW-2 Gi0/0 (Po1)
 ! L2 링크: 스위치포트 설정은 해당 주차 작업에서 추가
 no shutdown
!
interface GigabitEthernet1/1
 description to HQ-SW-2 Gi0/1 (Po1)
 ! L2 링크: 스위치포트 설정은 해당 주차 작업에서 추가
 no shutdown
!
interface GigabitEthernet1/2
 description to HQ-SW-3 Gi0/0 (Po2)
 ! L2 링크: 스위치포트 설정은 해당 주차 작업에서 추가
 no shutdown
!
interface GigabitEthernet1/3
 description to HQ-SW-3 Gi0/1 (Po2)
 ! L2 링크: 스위치포트 설정은 해당 주차 작업에서 추가
 no shutdown
!
interface GigabitEthernet3/0
 description to HQ-PC1 eth0 (VLAN 10 access)
 ! L2 링크: 스위치포트 설정은 해당 주차 작업에서 추가
 no shutdown
!
interface GigabitEthernet3/1
 description to HQ-PC2 eth0 (VLAN 20 access)
 ! L2 링크: 스위치포트 설정은 해당 주차 작업에서 추가
 no shutdown
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
end
