hostname HQ-R2
enable secret admin1234
no ip domain-lookup
service timestamps debug datetime msec
service timestamps log datetime msec
!
line con 0
 logging synchronous
 exec-timeout 0 0
line vty 0 4
 password admin1234
 login
!
interface Loopback0
 ip address 11.11.11.2 255.255.255.255
!
interface GigabitEthernet0/0
 description to HQ-SW-2 Gi1/0
 ip address 10.1.0.5 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0
 description to HQ-SW-3 Gi1/1
 ip address 10.1.0.13 255.255.255.252
 no shutdown
!
interface GigabitEthernet2/0
 description to HQ-R1 Gi2/0 
 ip address 10.1.0.18 255.255.255.252
 no shutdown
!
interface GigabitEthernet3/0
 description to ISP-2-PE-A Gi2/0 
 ip address 100.2.12.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet4/0
 description to Private-net Gi2/0 
 ip address 203.0.113.10 255.255.255.252
 no shutdown
!