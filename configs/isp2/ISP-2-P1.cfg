! ISP-2-P1 - 기본 컨피그 틀
! 기준 문서: docs/port-mapping.md (포트), docs/ip-mapping.md (IP)
! 포함: 호스트네임, 콘솔 설정, 인터페이스 설명, L3 링크 IP
! 제외: OSPF, BGP, HSRP/VARP, VLAN, EtherChannel, ACL, QoS, DMVPN (일정표의 주차별 작업에서 추가)
! 루프백, 라우터 ID: 미정
!
hostname ISP-2-P1
no ip domain-lookup
service timestamps debug datetime msec
service timestamps log datetime msec
!
interface GigabitEthernet0/0
 description to ISP-2-PE-A Gi0/0
 ip address 100.2.0.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0
 description to ISP-2-PE-B Gi0/0
 ip address 100.2.0.9 255.255.255.252
 no shutdown
!
interface GigabitEthernet2/0
 description to ISP-2-P2 Gi2/0
 ip address 100.2.0.17 255.255.255.252
 no shutdown
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
end
