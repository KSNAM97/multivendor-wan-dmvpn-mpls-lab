! DC-SW2-L2 - 기본 컨피그 틀
! 기준 문서: docs/port-mapping.md (포트), docs/ip-mapping.md (IP)
! 포함: 호스트네임, 콘솔 설정, 인터페이스 설명, L3 링크 IP
! 제외: OSPF, BGP, HSRP/VARP, VLAN, EtherChannel, ACL, QoS, DMVPN (일정표의 주차별 작업에서 추가)
! 루프백, 라우터 ID: 미정
!
hostname DC-SW2-L2
!
interface Ethernet1
   description to DC-SW3-L3 Et8 (트렁크)
   ! L2 링크: 스위치포트 설정은 해당 주차 작업에서 추가
!
interface Ethernet2
   description to DC-SW4-L3 Et8 (트렁크)
   ! L2 링크: 스위치포트 설정은 해당 주차 작업에서 추가
!
interface Ethernet12
   description to DC-DNS-2 eth0 (VLAN 50 access)
   ! L2 링크: 스위치포트 설정은 해당 주차 작업에서 추가
!
end
