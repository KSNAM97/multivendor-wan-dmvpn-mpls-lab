! DC-SW1-L3 - 기본 컨피그 틀
! 기준 문서: docs/port-mapping.md (포트), docs/ip-mapping.md (IP)
! 포함: 호스트네임, 콘솔 설정, 인터페이스 설명, L3 링크 IP
! 제외: OSPF, BGP, HSRP/VARP, VLAN, EtherChannel, ACL, QoS, DMVPN (일정표의 주차별 작업에서 추가)
! 루프백, 라우터 ID: 미정
!
hostname DC-SW1-L3
!
ip routing
!
interface Ethernet1
   description to DC-R1 Gi0/0
   no switchport
   ip address 10.2.0.2/30
!
interface Ethernet2
   description to DC-R2 Gi0/0
   no switchport
   ip address 10.2.0.9/30
!
interface Ethernet3
   description to DC-SW2-L3 Et3
   no switchport
   ip address 10.2.0.17/30
!
interface Ethernet4
   description to DC-SW3-L3 Et1
   no switchport
   ip address 10.2.0.21/30
!
interface Ethernet5
   description to DC-SW4-L3 Et1
   no switchport
   ip address 10.2.0.25/30
!
end
