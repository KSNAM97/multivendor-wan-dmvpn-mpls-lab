! DC-SW3-L3 - 기본 컨피그 틀
! 기준 문서: docs/port-mapping.md (포트), docs/ip-mapping.md (IP)
! 포함: 호스트네임, 콘솔 설정, 인터페이스 설명, L3 링크 IP
! 제외: OSPF, BGP, HSRP/VARP, VLAN, EtherChannel, ACL, QoS, DMVPN (일정표의 주차별 작업에서 추가)
! 루프백, 라우터 ID: 미정
!
hostname DC-SW3-L3
!
ip routing
!
interface Ethernet1
   description to DC-SW1-L3 Et4
   no switchport
   ip address 10.2.0.22/30
!
interface Ethernet2
   description to DC-SW2-L3 Et4
   no switchport
   ip address 10.2.0.30/30
!
interface Ethernet3
   description to DC-R3 Gi0/0
   no switchport
   ip address 10.2.0.38/30
!
interface Ethernet4
   description to DC-R4 Gi0/0
   no switchport
   ip address 10.2.0.41/30
!
interface Ethernet5
   description to DC-SW4-L3 Et5 (Po1)
   ! L2 링크: 스위치포트 설정은 해당 주차 작업에서 추가
!
interface Ethernet6
   description to DC-SW4-L3 Et6 (Po1)
   ! L2 링크: 스위치포트 설정은 해당 주차 작업에서 추가
!
interface Ethernet7
   description to DC-SW1-L2 Et1 (트렁크)
   ! L2 링크: 스위치포트 설정은 해당 주차 작업에서 추가
!
interface Ethernet8
   description to DC-SW2-L2 Et1 (트렁크)
   ! L2 링크: 스위치포트 설정은 해당 주차 작업에서 추가
!
end
