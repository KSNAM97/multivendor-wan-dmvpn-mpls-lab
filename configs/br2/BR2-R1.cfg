! BR2-R1 - 기본 컨피그 틀
! 기준 문서: docs/port-mapping.md (포트), docs/ip-mapping.md (IP)
! 포함: 호스트네임, 콘솔 설정, 인터페이스 설명, L3 링크 IP
! 제외: OSPF, BGP, HSRP/VARP, VLAN, EtherChannel, ACL, QoS, DMVPN (일정표의 주차별 작업에서 추가)
! 루프백, 라우터 ID: 미정
!
hostname BR2-R1
no ip domain-lookup
service timestamps debug datetime msec
service timestamps log datetime msec
!
interface GigabitEthernet0/0
 description to BR2-SW1-L3 Gi0/0
 ip address 10.4.0.1 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0
 description to BR2-SW2-L3 Gi0/0
 ip address 10.4.0.9 255.255.255.252
 no shutdown
!
interface GigabitEthernet2/0
 description to BR2-R2 Gi2/0
 ip address 10.4.0.17 255.255.255.252
 no shutdown
!
interface GigabitEthernet3/0
 description to ISP-1-PE-B Gi3/0 (ISP-1 연결)
 ip address 100.1.41.1 255.255.255.252
 no shutdown
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
end
