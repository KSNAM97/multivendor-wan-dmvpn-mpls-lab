! PrivI-net - 기본 컨피그 틀
! 기준 문서: docs/port-mapping.md (포트), docs/ip-mapping.md (IP)
! 포함: 호스트네임, 콘솔 설정, 인터페이스 설명, L3 링크 IP
! 제외: OSPF, BGP, HSRP/VARP, VLAN, EtherChannel, ACL, QoS, DMVPN (일정표의 주차별 작업에서 추가)
! 루프백, 라우터 ID: 미정
!
hostname PrivI-net
no ip domain-lookup
service timestamps debug datetime msec
service timestamps log datetime msec
!
interface GigabitEthernet0/0
 description to DC-R1 Gi2/0 (PI 연결)
 ip address 203.0.113.2 255.255.255.252
 no shutdown
!
interface GigabitEthernet1/0
 description to DC-R2 Gi2/0 (PI 연결, DMVPN Hub Tunnel0 source)
 ip address 203.0.113.6 255.255.255.252
 no shutdown
!
interface GigabitEthernet2/0
 description to HQ-R2 Gi4/0 (PI 연결)
 ip address 203.0.113.10 255.255.255.252
 no shutdown
!
interface GigabitEthernet3/0
 description to BR1-R1 Gi4/0 (PI 연결, DMVPN Spoke Tunnel0 source)
 ip address 203.0.113.14 255.255.255.252
 no shutdown
!
interface GigabitEthernet4/0
 description to BR2-R2 Gi4/0 (PI 연결, DMVPN Spoke Tunnel0 source)
 ip address 203.0.113.18 255.255.255.252
 no shutdown
!
line con 0
 logging synchronous
 exec-timeout 0 0
!
end
