<text x="515.0" y="891.0" class="s" text-anchor="middle">DMVPN Hub</text>
<line x1="635" y1="860" x2="638.75" y2="822" class="lp"/>
<rect x="585" y="860" width="100" height="40" rx="6" class="devp"/>
<text x="635.0" y="878.0" class="n" text-anchor="middle">HQ-R2</text>
<text x="635.0" y="891.0" class="s" text-anchor="middle">DMVPN Spoke</text>
<line x1="755" y1="860" x2="668.75" y2="822" class="lp"/>
<rect x="705" y="860" width="100" height="40" rx="6" class="devp"/>
