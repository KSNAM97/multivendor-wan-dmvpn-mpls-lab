<text x="870.0" y="321.0" class="n" text-anchor="middle">DC-R4</text>
<rect x="510" y="258" width="260" height="34" rx="6" class="devp"/>
<text x="640.0" y="279.0" class="n" text-anchor="middle">DC-R1 · DC-R2</text>
<text x="640" y="306" class="tag" text-anchor="middle">PI 연결, DMVPN Hub = DC-R2</text>
<rect x="510" y="316" width="260" height="34" rx="6" class="dev"/>
