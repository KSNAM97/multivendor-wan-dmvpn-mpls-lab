<text x="290" y="160" class="s" text-anchor="middle">eBGP</text>
<text x="990" y="160" class="s" text-anchor="middle">eBGP</text>
<rect x="20" y="712" width="290" height="318" rx="12" class="panel"/>
<text x="165" y="738" class="h" text-anchor="middle">범례</text>
<line x1="36" y1="772" x2="76" y2="772" class="l1"/>
<text x="88" y="776" class="s" text-anchor="start">사이트 엣지 eBGP: ISP-1 (사이트 AS ↔ 65100)</text>
<line x1="36" y1="808" x2="76" y2="808" class="l2"/>
<text x="88" y="812" class="s" text-anchor="start">사이트 엣지 eBGP: ISP-2 (사이트 AS ↔ 65200)</text>
<line x1="36" y1="844" x2="76" y2="844" class="lc"/>
<text x="88" y="848" class="s" text-anchor="start">ISP 내부: iBGP RR, OSPF 1, MPLS(LDP)</text>
<line x1="36" y1="880" x2="76" y2="880" class="lp"/>
<text x="88" y="884" class="s" text-anchor="start">Private Internet 언더레이(OSPF 2)</text>
<line x1="36" y1="916" x2="76" y2="916" class="lt"/>
<text x="88" y="920" class="s" text-anchor="start">DMVPN Phase 3 터널(172.16.0.0/24)</text>
<text x="36" y="958" class="s" text-anchor="start">각 사이트는 ISP-1과 ISP-2에 서로 다른</text>
<text x="36" y="974" class="s" text-anchor="start">라우터로 연결(R1은 ISP-1, R2는 ISP-2).</text>
<text x="36" y="990" class="s" text-anchor="start">장비 이름이 같은 색의 선과 외곽선으로 연결.</text>
<rect x="330" y="712" width="620" height="318" rx="12" class="panel"/>
<text x="640" y="738" class="hp" text-anchor="middle">Private Internet · 203.0.113.0/24</text>
<ellipse cx="640" cy="790" rx="170" ry="34" class="devp"/>
<text x="640" y="788" class="n" text-anchor="middle">Private-net</text>
<text x="640" y="803" class="s" text-anchor="middle">OSPF 2 / Area 100 · ACL 화이트리스트</text>
<line x1="395" y1="860" x2="578.75" y2="822" class="lp"/>
<rect x="345" y="860" width="100" height="40" rx="6" class="devp"/>
