<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 892" width="1000" height="892" role="img" aria-labelledby="t d" text-rendering="geometricPrecision">
<title id="t">네트워크 개요도</title>
<desc id="d">HQ, DC, BR1, BR2 네 사이트가 ISP-1, ISP-2에 사이트 엣지 eBGP로 연결되고, ISP 내부는 iBGP Route Reflector와 MPLS L3VPN, 사이트 간은 Private Internet 위의 DMVPN Phase 3로도 연결되는 개요도</desc>
<style>
:root{--bg:#ffffff;--panel:#f6f8fa;--stroke:#d0d7de;--text:#1f2328;--sub:#4f5962;--dev:#ffffff;--site:#ffffff;--isp1:#0969da;--isp2:#bc4c00;--core:#8c959f;--pi:#1a7f37;--pifill:#dafbe1;--tun:#8250df}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--panel:#161b22;--stroke:#30363d;--text:#e6edf3;--sub:#aab2bb;--dev:#21262d;--site:#0d1117;--isp1:#58a6ff;--isp2:#f0883e;--core:#8b949e;--pi:#3fb950;--pifill:#12261e;--tun:#bc8cff}}
text{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",Arial,sans-serif;fill:var(--text)}
.bg{fill:var(--bg)}
.panel{fill:var(--panel);stroke:var(--stroke);stroke-width:1.5}
.p1{fill:var(--panel);stroke:var(--isp1);stroke-width:2}
.p2{fill:var(--panel);stroke:var(--isp2);stroke-width:2}
.site{fill:var(--site);stroke:var(--stroke);stroke-width:1.5}
.dev{fill:var(--dev);stroke:var(--stroke);stroke-width:1.3}
.dev1{fill:var(--dev);stroke:var(--isp1);stroke-width:2}
.dev2{fill:var(--dev);stroke:var(--isp2);stroke-width:2}
.devp{fill:var(--pifill);stroke:var(--pi);stroke-width:2}
.l1{stroke:var(--isp1);stroke-width:3.5;fill:none}
.l2{stroke:var(--isp2);stroke-width:3.5;fill:none}
.lc{stroke:var(--core);stroke-width:3.5;fill:none}
.lp{stroke:var(--pi);stroke-width:3;fill:none}
.lt{stroke:var(--tun);stroke-width:3;stroke-dasharray:8 6;fill:none}
.title{font-size:26px;font-weight:700}
.sub{font-size:14px;fill:var(--sub)}
.h{font-size:16px;font-weight:700}
.h1{font-size:17px;font-weight:700;fill:var(--isp1)}
.h2{font-size:17px;font-weight:700;fill:var(--isp2)}
.hp{font-size:15px;font-weight:700;fill:var(--pi)}
.n{font-size:14px}
.s{font-size:13px;fill:var(--sub)}
.tag{font-size:11.5px;font-weight:700;fill:var(--tun)}
</style>
