<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 1040" width="1280" height="1040" role="img" aria-labelledby="t d">
<title id="t">네트워크 구성도</title>
<desc id="d">HQ, DC, BR1, BR2 네 사이트가 ISP-1, ISP-2에 사이트 엣지 eBGP로 연결되고, ISP 내부는 iBGP Route Reflector와 MPLS L3VPN, 사이트 간은 Private Internet 위의 DMVPN Phase 3로도 연결되는 구성도</desc>
<style>
:root{--bg:#ffffff;--panel:#f6f8fa;--stroke:#d0d7de;--text:#1f2328;--sub:#59636e;--dev:#ffffff;--site:#ffffff;--isp1:#0969da;--isp2:#bc4c00;--core:#8c959f;--pi:#1a7f37;--pifill:#dafbe1;--tun:#8250df}
@media (prefers-color-scheme: dark){:root{--bg:#0d1117;--panel:#161b22;--stroke:#30363d;--text:#e6edf3;--sub:#9198a1;--dev:#21262d;--site:#0d1117;--isp1:#58a6ff;--isp2:#f0883e;--core:#8b949e;--pi:#3fb950;--pifill:#12261e;--tun:#bc8cff}}
text{font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo","Segoe UI",Arial,sans-serif;fill:var(--text)}
.bg{fill:var(--bg)}
.panel{fill:var(--panel);stroke:var(--stroke);stroke-width:1.5}
.p1{fill:var(--panel);stroke:var(--isp1);stroke-width:1.8}
.p2{fill:var(--panel);stroke:var(--isp2);stroke-width:1.8}
.site{fill:var(--site);stroke:var(--stroke);stroke-width:1.5}
.dev{fill:var(--dev);stroke:var(--stroke);stroke-width:1.2}
.dev1{fill:var(--dev);stroke:var(--isp1);stroke-width:1.8}
.dev2{fill:var(--dev);stroke:var(--isp2);stroke-width:1.8}
.devp{fill:var(--pifill);stroke:var(--pi);stroke-width:1.8}
.l1{stroke:var(--isp1);stroke-width:3;fill:none}
.l2{stroke:var(--isp2);stroke-width:3;fill:none}
.lc{stroke:var(--core);stroke-width:3;fill:none}
.lp{stroke:var(--pi);stroke-width:2.5;fill:none}
.lt{stroke:var(--tun);stroke-width:2.5;stroke-dasharray:7 6;fill:none}
.title{font-size:22px;font-weight:700}
.sub{font-size:12px;fill:var(--sub)}
.h{font-size:14px;font-weight:700}
.h1{font-size:15px;font-weight:700;fill:var(--isp1)}
.h2{font-size:15px;font-weight:700;fill:var(--isp2)}
.hp{font-size:14px;font-weight:700;fill:var(--pi)}
.n{font-size:12px}
.s{font-size:11px;fill:var(--sub)}
.tag{font-size:10px;font-weight:700;fill:var(--tun)}
</style>
<rect x="0" y="0" width="1280" height="1040" rx="0" class="bg"/>
<text x="640.0" y="36" class="title" text-anchor="middle">네트워크 구성도</text>
<text x="640.0" y="58" class="sub" text-anchor="middle">HQ · DC · BR1 · BR2  |  ISP 이중화(사이트 엣지 eBGP, ISP 내부 iBGP RR, MPLS L3VPN)  |  DMVPN Phase 3</text>
