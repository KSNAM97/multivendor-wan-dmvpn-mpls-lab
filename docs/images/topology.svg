<rect x="362" y="600" width="96" height="34" rx="6" class="dev1"/>
<text x="410.0" y="621.0" class="n" text-anchor="middle">BR2-R1</text>
<rect x="822" y="600" width="96" height="34" rx="6" class="dev2"/>
<text x="870.0" y="621.0" class="n" text-anchor="middle">BR2-R2</text>
<text x="870" y="650" class="tag" text-anchor="middle">DMVPN Spoke</text>
