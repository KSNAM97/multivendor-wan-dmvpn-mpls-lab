<text x="875.0" y="891.0" class="s" text-anchor="middle">DMVPN Spoke</text>
<path d="M515,900 C515,946 635,946 635,900" class="lt"/>
<path d="M515,900 C515,964 755,964 755,900" class="lt"/>
<path d="M515,900 C515,982 875,982 875,900" class="lt"/>
<text x="640" y="1014" class="s" text-anchor="middle">DMVPN Phase 3(mGRE over IPsec): Hub DC-R2 ↔ Spoke HQ-R2 · BR1-R1 · BR2-R2, Spoke 간 shortcut</text>
<rect x="970" y="712" width="290" height="318" rx="12" class="panel"/>
<text x="1115" y="738" class="h" text-anchor="middle">라우팅 요약</text>
<text x="986" y="768" class="s" text-anchor="start">사이트 내부: OSPF</text>
<text x="986" y="790" class="s" text-anchor="start">  (DC 0, HQ 1, BR1 2, BR2 3)</text>
<text x="986" y="812" class="s" text-anchor="start">사이트 → ISP: 사이트 /16만 광고</text>
<text x="986" y="834" class="s" text-anchor="start">  (route-map, prefix-list)</text>
<text x="986" y="856" class="s" text-anchor="start">ISP → 사이트: 기본 경로만 전달</text>
<text x="986" y="878" class="s" text-anchor="start">  (default-originate)</text>
<text x="986" y="900" class="s" text-anchor="start">장애 전환: BGP hold 9초 후</text>
<text x="986" y="922" class="s" text-anchor="start">  OSPF 기본 경로 metric 100→200</text>
<text x="986" y="944" class="s" text-anchor="start">ISP-1, ISP-2 사이 연결 없음</text>
<text x="986" y="966" class="s" text-anchor="start">게이트웨이 VRRP, STP는 MSTP</text>
<text x="986" y="988" class="s" text-anchor="start">DC만 Arista cEOS, 나머지 Cisco</text>
</svg>
